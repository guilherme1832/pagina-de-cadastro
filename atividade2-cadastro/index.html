<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

<div class="caixa">

    <form>
            
        <img src="img/logo intelbras-Photoroom.png" alt="">

           <h1>Criar Sua Conta</h1>
        
              <h3><strong>Preencha Seus Dados Para Começar</strong></h3>


        <label for="nome"><strong>Nome Completo:</strong></label>
               <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

        <label for="email"><strong>E-mail:</strong></label>    
               <input type="email" id="email" name="email" placeholder="seu_email@exemplo.com" required>
        
        <label for="senha"><strong>Senha</strong></label>
               <input type="password" id="senha" name="senha" placeholder="digite sua senha" required>

        <div class="data-genero">

            <div>
                <label for="data"><strong>Data de Nascimento:</strong></label>
                       <input type="date" id="data" name="data" min="1900-01-01" max="2030-12-31" required>
            </div>

            <div class="genero">

              <label for="genero"><strong>Gênero</strong>:</label>
                <select id="genero" name="genero" required>
                    <option value="">Selecione</option>
                         <option value="masculino">Masculino</option>
                       <option value="feminino">Feminino</option>
                     <option value="outro">Outro</option>
                <option value="Prefiro Não Dizer">Prefiro Não Dizer</option>
           </select>
     </div>

</div>

        <p class="termos">Termos de Uso </p>

        <label for="termos">
           
            <input type="checkbox" id="termos" required>

         <sub>   Li e concordo com os <a href="#">termos de uso</a> e a
            <a href="#">política de privacidade</a>. </sub>

        </label>
 
        <br>

        <button type="submit">Cadastrar</button>

        <p class="login"> <sub>ja tem uma conta? <a href="login.html">Entrar.</a></sub></p>

    </form>

</div>


</body>
</html>
